model:
  type: LogisticRegression
  max_iter: 100
  penalty: "l2"
  solver: "lbfgs"
  C: 1.0
split:  
  test_size: 0.2
  random_state: 42
paths:
  raw_data: data/raw/telco_churn.csv
  processed_data: data/processed/telco_clean.csv
  model_path: models/logistic_regression.pkl
  metrics: reports/metrics.json
  scaler: models/scaler.pkl